name: Deploy to Cloudflare Workers

# Manually triggered for now via the Actions tab (workflow_dispatch).
# CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN are already set as repo
# secrets — switch this to `push: branches: [main]` for auto-deploy on merge
# once DNS/custom domain setup is confirmed working end to end.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
